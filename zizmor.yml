# zizmor configuration — explicit rule allowlists for findings that
# are real but deferred to focused follow-up PRs.
#
# Format reference: https://docs.zizmor.sh/configuration/

rules:
  # All workflows currently use @v4 / @v3 major-version tags
  # (actions/checkout, pnpm/action-setup, etc.) rather than SHA pins.
  # Fixing this is a mechanical change across every workflow file +
  # warrants its own focused review pass to verify each pinned SHA
  # matches the intended release. Tracked as a separate PR; remove
  # this ignore + bump zizmor min-severity back to `low` once SHA
  # pinning lands.
  unpinned-uses:
    ignore:
      - .github/workflows/ci.yml
      - .github/workflows/codeql.yml
      - .github/workflows/gitleaks.yml
      - .github/workflows/osv-scanner.yml
      - .github/workflows/zizmor.yml

  # Dependabot config can opt into a cooldown period (delay opening
  # PRs for newly-released versions) to let upstream bake-time absorb
  # the bad-release class of supply-chain attack. Worth doing but a
  # config-tuning decision rather than a security gate; deferred to
  # the same follow-up that handles SHA pinning.
  dependabot-cooldown:
    ignore:
      - .github/dependabot.yml
