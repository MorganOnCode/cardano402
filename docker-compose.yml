# Development and production Docker services
# Dev:  docker compose --profile development up (starts redis + ipfs for local development)
# Prod: docker compose --profile production up (starts facilitator + redis with auth)

services:
  # --- Development services (default, no profile needed) ---

  ipfs:
    image: ipfs/kubo:latest
    container_name: cardano402-ipfs
    profiles:
      - development
    ports:
      - "4001:4001"      # P2P swarm
      - "5001:5001"      # HTTP API
      - "8080:8080"      # Gateway
    volumes:
      - ipfs_data:/data/ipfs
    environment:
      - IPFS_PATH=/data/ipfs
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cardano402-redis
    profiles:
      - development
    user: "999:1000"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # --- Production services (--profile production) ---

  facilitator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cardano402
    profiles:
      - production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./config/config.json:/app/config/config.json:ro
      - ./secrets:/run/secrets:ro
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - NODE_ENV=production
      # Mainnet safety guardrail (src/chain/config.ts). Must be "true" when
      # config.json has chain.network = "Mainnet"; "false" otherwise.
      - MAINNET=${MAINNET:-false}
      # Explicit hot-wallet acknowledgement required for Mainnet local-file signing.
      - CARDANO402_ALLOW_MAINNET_LOCAL_FILE_SIGNER=${CARDANO402_ALLOW_MAINNET_LOCAL_FILE_SIGNER:-false}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis-prod:
        condition: service_healthy
    restart: unless-stopped

  redis-prod:
    image: redis:7-alpine
    container_name: cardano402-redis-prod
    profiles:
      - production
    user: "999:1000"
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_prod_data:/data
    # noeviction is required for fund-safety: settlement dedup keys are part
    # of replay protection and must fail loudly under pressure, not disappear.
    command: >
      redis-server
      --appendonly yes
      --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD is required for redis-prod}"
      --maxmemory 256mb
      --maxmemory-policy noeviction
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required for redis-prod}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  ipfs_data:
  redis_data:
  redis_prod_data:
