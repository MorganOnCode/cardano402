<style>
  :root {
    /* Cardano deep blue, warm cream, hot peach, sticker pink, mint */
    --ink: #0a1024;
    --ink-soft: #1c2545;
    --paper: #fbf6ec;
    --paper-2: #f3ead7;
    --cream: #fff8e8;
    --blue: #0033ad;       /* cardano */
    --blue-2: #2a52ff;
    --peach: #ff8a4c;
    --pink: #ff4d8d;
    --mint: #7be0a3;
    --lemon: #ffd84d;
    --lilac: #c9b8ff;

    --r-lg: 28px;
    --r-md: 18px;
    --r-sm: 10px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    transition: background .25s ease;
  }
  body[data-mode="dev"] { background: #f1ede2; }
  a { color: inherit; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
  .serif { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; }

  /* layout */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 28px; }

  /* nav */
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 0;
  }
  .logo {
    display: inline-flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 18px; letter-spacing: -0.01em;
  }
  .logo-mark {
    width: 30px; height: 30px; border-radius: 9px;
    background: var(--ink); color: var(--paper);
    display: grid; place-items: center;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px;
    transform: rotate(-4deg);
  }
  .nav-links { display: flex; gap: 28px; align-items: center; font-size: 15px; }
  .nav-links a { text-decoration: none; opacity: 0.75; }
  .nav-links a:hover { opacity: 1; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 18px; border-radius: 999px;
    background: var(--ink); color: var(--paper);
    text-decoration: none; font-weight: 600; font-size: 14.5px;
    border: none; cursor: pointer;
    transition: transform .15s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn.ghost {
    background: transparent; color: var(--ink);
    border: 1.5px solid var(--ink);
  }
  .btn.peach { background: var(--peach); color: var(--ink); }
  .btn.blue { background: var(--blue); color: white; }
  .btn.pink { background: var(--pink); color: white; }

  /* universal flair */
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px 6px 8px; border-radius: 999px;
    background: white; border: 1.5px solid var(--ink);
    font-size: 13px; font-weight: 500;
  }
  .pill .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--peach); display: inline-block;
    box-shadow: 0 0 0 3px rgba(255,138,76,0.25);
  }

  /* sections */
  section { padding: 80px 0; position: relative; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-soft); opacity: 0.7;
  }
  h2.section-title {
    font-size: clamp(38px, 5vw, 64px);
    line-height: 1.02; letter-spacing: -0.025em;
    font-weight: 700; margin: 14px 0 24px; max-width: 900px;
    text-wrap: balance;
  }
  h2 .scribble { color: var(--blue); position: relative; }

  /* shared sticker bits */
  .sticker {
    position: absolute; pointer-events: none;
    font-family: 'Bricolage Grotesque'; font-weight: 700;
  }

  /* footer */
  footer {
    border-top: 1.5px solid var(--ink);
    padding: 40px 0 60px; margin-top: 40px;
    background: var(--paper-2);
  }
  footer .row { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  footer .col h4 { margin: 0 0 12px; font-size: 13px; opacity: 0.6; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
  footer .col a { display: block; text-decoration: none; padding: 4px 0; opacity: 0.85; }
  footer .col a:hover { opacity: 1; }
  footer .signoff { font-size: 14px; opacity: 0.7; margin-top: 28px; }

  /* selection */
  ::selection { background: var(--peach); color: var(--ink); }
</style>
