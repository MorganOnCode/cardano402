<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0f1d35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid lines -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
  </g>
  
  <!-- Accent glow -->
  <circle cx="900" cy="200" r="300" fill="#38bdf8" opacity="0.04"/>
  <circle cx="300" cy="500" r="250" fill="#34d399" opacity="0.03"/>
  
  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)" opacity="0.6"/>
  
  <!-- Badge -->
  <rect x="80" y="160" width="240" height="32" rx="16" fill="#34d399" opacity="0.15" stroke="#34d399" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="100" cy="176" r="4" fill="#34d399"/>
  <text x="114" y="181" font-family="monospace" font-size="13" fill="#34d399" font-weight="500">Live on Cardano Mainnet</text>
  
  <!-- Title -->
  <text x="80" y="260" font-family="Georgia, serif" font-size="64" fill="#f0f2fa" font-weight="400">Pay for anything</text>
  <text x="80" y="340" font-family="Georgia, serif" font-size="64" fill="#f0f2fa" font-weight="400">with <tspan fill="#38bdf8" font-style="italic">HTTP 402</tspan></text>
  
  <!-- Subtitle -->
  <text x="80" y="400" font-family="system-ui, sans-serif" font-size="22" fill="#6b7394">The first Cardano x402 payment facilitator.</text>
  <text x="80" y="430" font-family="system-ui, sans-serif" font-size="22" fill="#6b7394">Verify and settle ADA payments over HTTP.</text>
  
  <!-- Stats bar -->
  <g transform="translate(80, 480)">
    <rect width="220" height="70" rx="8" fill="#12141c" stroke="#1e2230" stroke-width="1"/>
    <text x="110" y="30" font-family="Georgia, serif" font-size="28" fill="#34d399" text-anchor="middle">Live</text>
    <text x="110" y="52" font-family="monospace" font-size="11" fill="#6b7394" text-anchor="middle" text-transform="uppercase">CARDANO MAINNET</text>
    
    <rect x="240" width="220" height="70" rx="8" fill="#12141c" stroke="#1e2230" stroke-width="1"/>
    <text x="350" y="30" font-family="Georgia, serif" font-size="28" fill="#f0f2fa" text-anchor="middle">10</text>
    <text x="350" y="52" font-family="monospace" font-size="11" fill="#6b7394" text-anchor="middle">VERIFICATION CHECKS</text>
    
    <rect x="480" width="220" height="70" rx="8" fill="#12141c" stroke="#1e2230" stroke-width="1"/>
    <text x="590" y="30" font-family="Georgia, serif" font-size="28" fill="#f0f2fa" text-anchor="middle">0%</text>
    <text x="590" y="52" font-family="monospace" font-size="11" fill="#6b7394" text-anchor="middle">CUSTODY RISK</text>
    
    <rect x="720" width="220" height="70" rx="8" fill="#12141c" stroke="#1e2230" stroke-width="1"/>
    <text x="830" y="30" font-family="Georgia, serif" font-size="28" fill="#f0f2fa" text-anchor="middle">&lt;30s</text>
    <text x="830" y="52" font-family="monospace" font-size="11" fill="#6b7394" text-anchor="middle">SETTLEMENT TIME</text>
  </g>
  
  <!-- Domain -->
  <text x="1120" y="600" font-family="monospace" font-size="16" fill="#3d4466" text-anchor="end">cardano402.com</text>
</svg>
