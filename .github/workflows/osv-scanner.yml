# OSV-Scanner — open-source vulnerability scanning against the OSV.dev
# database (the authoritative source for npm advisories that Dependabot
# and `pnpm audit` both pull from).
#
# Complements the existing tooling rather than replacing it:
#   - `pnpm audit` runs in CI but uses npm's GHSA feed and ignores some
#     transitives.
#   - Dependabot opens PRs for direct deps, doesn't scan against OSV
#     in pull-request context.
#   - CodeQL (.github/workflows/codeql.yml) covers semantic code flaws,
#     not known-vulnerable dependency versions.
#
# OSV-Scanner fills the gap: per-PR check against the OSV database with
# SARIF output that appears under Security → Code scanning, so any new
# vulnerable transitive that lands in pnpm-lock.yaml fails review before
# merge.
#
# Reference: https://github.com/google/osv-scanner-action

name: OSV-Scanner

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly catch-all in case the OSV database publishes a new advisory
    # against an already-merged dep version. Wednesday 04:23 UTC is off-
    # peak and out of the main work hours.
    - cron: '23 4 * * 3'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan-pr:
    name: Scan (pull request)
    if: ${{ github.event_name == 'pull_request' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2
    with:
      # Scan the whole repo. The action reads pnpm-lock.yaml directly,
      # so workspace-wide transitives are covered.
      scan-args: |-
        --recursive
        --skip-git
        ./
    permissions:
      contents: read
      security-events: write
      actions: read

  scan-branch:
    name: Scan (push / scheduled)
    if: ${{ github.event_name != 'pull_request' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2
    with:
      scan-args: |-
        --recursive
        --skip-git
        ./
    permissions:
      contents: read
      security-events: write
      actions: read
