# OSV-Scanner — open-source vulnerability scanning against the OSV.dev
# database (the authoritative source for npm advisories that Dependabot
# and `pnpm audit` both pull from).
#
# Complements the existing tooling rather than replacing it:
#   - `pnpm audit` runs in CI but uses npm's GHSA feed and ignores some
#     transitives. Informational, not PR-blocking.
#   - Dependabot opens PRs for direct deps, doesn't scan against OSV
#     in pull-request context.
#   - CodeQL (.github/workflows/codeql.yml) covers semantic code flaws,
#     not known-vulnerable dependency versions.
#   - gitleaks (.github/workflows/gitleaks.yml) catches secrets, not
#     vulnerable deps.
#
# OSV-Scanner fills the per-PR-blocking-vuln-check gap. SARIF output
# surfaces under Security → Code scanning, so any new vulnerable
# transitive that lands in pnpm-lock.yaml fails review before merge.
#
# Follows the upstream canonical shape: top-level `permissions:` only
# (per-job permissions can't be passed when calling a reusable
# workflow), one job per trigger family, scan args following the
# upstream example.
#
# Reference: https://github.com/google/osv-scanner-action

name: OSV-Scanner

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly catch-all in case the OSV database publishes a new advisory
    # against an already-merged dep version. Wednesday 04:23 UTC is off-
    # peak and out of main work hours.
    - cron: '23 4 * * 3'

permissions:
  # Required to upload SARIF to GitHub code scanning.
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    if: ${{ github.event_name == 'pull_request' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --include-git-root
        -r
        ./

  scan-branch:
    if: ${{ github.event_name != 'pull_request' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --include-git-root
        -r
        ./
