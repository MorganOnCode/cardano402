# zizmor — static analysis for GitHub Actions workflows.
#
# Catches the class of misconfiguration that CodeQL + OSV-Scanner +
# gitleaks don't: insecure patterns in our OWN workflow files. Things
# like unpinned third-party actions (an action hijacked at a floating
# tag — the tj-actions/changed-files compromise pattern), secret bleed
# through expression interpolation, the pull_request_target footgun,
# excessive token permissions, etc.
#
# SARIF output appears under Security → Code scanning, alongside the
# CodeQL and OSV-Scanner findings. Findings at >=low severity surface
# in PR review.
#
# Reference: https://docs.zizmor.sh/

name: zizmor

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly catch-all in case zizmor publishes a new rule against a
    # pattern in an already-merged workflow. Thursday 04:31 UTC, off-
    # peak and out of main work hours.
    - cron: '31 4 * * 4'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  zizmor:
    name: zizmor (workflow static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Full history so the GITHUB_TOKEN scope is recognised for
          # online audits that resolve action @refs against upstream
          # releases.
          fetch-depth: 0

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # `regular` persona is the default — focuses on findings most
          # operators want surfaced. `pedantic` and `auditor` produce
          # more noise; switch to those if doing a dedicated audit pass.
          persona: regular
          # `low` surfaces the audit-verdict patterns: unpinned third-
          # party actions, secret bleed via expression interpolation,
          # template injection, the pull_request_target footgun. Was
          # temporarily `high` while the SHA-pinning backlog was being
          # cleared (see git history); now that every action across
          # ci.yml / codeql.yml / gitleaks.yml / osv-scanner.yml /
          # zizmor.yml is SHA-pinned, the `unpinned-uses` rule has
          # nothing to flag.
          min-severity: low
