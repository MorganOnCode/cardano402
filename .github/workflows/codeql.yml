# CodeQL semantic security analysis.
#
# Catches the class of issue our test suite + ESLint + `pnpm audit` don't:
# semantic injection sinks, prototype pollution, taint-propagation flaws,
# and TypeScript-specific patterns CodeQL's javascript-typescript query
# pack has built-in checks for. Findings appear under the repo's
# Security tab → Code scanning, and inline on PRs.
#
# Free for public repos.
# Reference: https://github.com/github/codeql-action

name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly scan in case a new query/CVE pattern surfaces against
    # already-merged code. Tuesday 04:17 UTC is off-peak and out of the
    # main work hours so the run doesn't compete with CI.
    - cron: '17 4 * * 2'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3
        with:
          languages: ${{ matrix.language }}
          # Run the extended security-and-quality query pack — more checks
          # than the default "security" pack, accepts some noise to catch
          # more.
          queries: security-and-quality

      # No manual build step needed for JS/TS — CodeQL's autobuild handles
      # tsc compilation. Skipping `pnpm install` keeps the analysis from
      # scanning node_modules for findings against dependencies.
      - name: Autobuild
        uses: github/codeql-action/autobuild@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v3
        with:
          category: '/language:${{ matrix.language }}'
