name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:  # Manual trigger

# Only run one deploy at a time
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Run CI checks first
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to cardano402.com
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd /root/cardano-x402
            git pull origin master
            docker compose -f docker-compose.prod.yml up -d --build facilitator
            sleep 15
            # Health check
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Deploy successful — health check passed"
            else
              echo "❌ Deploy failed — health check returned $HTTP_CODE"
              docker compose -f docker-compose.prod.yml logs facilitator --tail 20
              exit 1
            fi
