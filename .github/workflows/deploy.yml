name: Deploy website

# Static cardano402.com website only (apps/facilitator/wrangler.website.jsonc):
# no Worker script, facilitator, demo, binding or provider secret. Nothing here
# runs on push or pull request; a person starts it by hand from master.
#   target=staging     review copy on workers.dev (Worker cardano402-website-staging)
#   target=production  attaches the cardano402.com and www Workers Routes; waits
#                      for a reviewer on the `production` environment
# DNS and tunnel ingress are never changed. Rollback = delete the two routes.
#
# Required settings:
#   secrets.CLOUDFLARE_API_TOKEN   Workers Scripts:Edit (+ Workers Routes:Edit for production)
#   secrets.CLOUDFLARE_ACCOUNT_ID
#   vars.CLOUDFLARE_DEPLOY_ENABLED 'true'
#   vars.PRODUCTION_URL            https://cardano402.com
#   environment `production` with required reviewers, limited to master

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'staging (workers.dev review copy) or production (cardano402.com routes, needs approval)'
        required: true
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-cardano402-website
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  staging:
    name: Deploy static website (staging, workers.dev)
    needs: ci
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/master' && inputs.target == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
    defaults:
      run:
        working-directory: apps/facilitator
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:website
      - name: Deploy staging copy (no routes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.website.jsonc --env staging --message "${GITHUB_SHA}" | tee staging-deploy.log
      - name: Check staging copy (read-only)
        run: |
          url="$(grep -oE 'https://cardano402-website-staging\.[a-z0-9-]+\.workers\.dev' staging-deploy.log | head -1)"
          test -n "$url"
          node scripts/smoke-website.mjs "$url"

  production:
    name: Deploy static website (cardano402.com routes)
    needs: ci
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/master' && inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    defaults:
      run:
        working-directory: apps/facilitator
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:website
      - name: Deploy website routes (DNS and tunnel ingress unchanged)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.website.jsonc --message "${GITHUB_SHA}"
      - name: Check both hosts (read-only)
        run: |
          node scripts/smoke-website.mjs https://cardano402.com
          node scripts/smoke-website.mjs https://www.cardano402.com
