name: Preview Facilitator Monitor

# Manual read-only check. No background monitoring calls for the portfolio.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: vars.PREVIEW_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: node apps/facilitator/scripts/smoke.mjs "${{ vars.PREVIEW_URL }}" cardano:preview
