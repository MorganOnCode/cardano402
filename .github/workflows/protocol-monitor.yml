name: Protocol Monitor

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL to check
        required: false
        default: https://cardano402.com
      min_confirmations:
        description: Minimum approved confirmation depth
        required: false
        default: '6'
  # Re-enable the hourly schedule after Cloudflare allows machine API routes
  # without Managed Challenge responses.

permissions:
  contents: read

jobs:
  protocol-monitor:
    name: x402 Machine Endpoint Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ inputs.base_url || 'https://cardano402.com' }}
      MIN_CONFIRMATIONS: ${{ inputs.min_confirmations || '6' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.8.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check x402 machine endpoints
        run: pnpm monitor:protocol -- --base-url "$BASE_URL" --min-confirmations "$MIN_CONFIRMATIONS" --json
