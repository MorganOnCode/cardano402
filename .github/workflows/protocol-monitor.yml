name: Protocol Monitor

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL to check
        required: false
        default: https://cardano402.com
      min_confirmations:
        description: Minimum approved confirmation depth
        required: false
        default: '6'
  # Re-enable the hourly schedule after Cloudflare allows machine API routes
  # without Managed Challenge responses.

permissions:
  contents: read

jobs:
  protocol-monitor:
    name: x402 Machine Endpoint Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ inputs.base_url || 'https://cardano402.com' }}
      MIN_CONFIRMATIONS: ${{ inputs.min_confirmations || '6' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.8.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check x402 machine endpoints
        run: pnpm monitor:protocol -- --base-url "$BASE_URL" --min-confirmations "$MIN_CONFIRMATIONS" --json
