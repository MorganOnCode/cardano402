# OpenSSF Scorecard — weekly supply-chain hygiene report.
#
# Runs the OpenSSF Scorecard checks against the repo and uploads
# results to GitHub Security → Code scanning. Scorecard measures
# practices the audit verdict explicitly called out: branch
# protection, signed commits, token permissions, dependency-update
# tools, fuzzing, SAST, etc. It doesn't run per-PR (it scores the
# whole repo, not a diff), so push-to-master + weekly cron is the
# correct trigger.
#
# Output also appears on the OpenSSF Scorecard public dashboard
# (https://securityscorecards.dev/viewer/?uri=github.com/MorganOnCode/cardano402)
# — useful for advertising supply-chain posture without operator
# effort.
#
# Reference: https://github.com/ossf/scorecard-action

name: Scorecard supply-chain security

on:
  push:
    branches: [master]
  schedule:
    # Weekly. Friday 04:37 UTC; off-peak, out of business hours.
    - cron: '37 4 * * 5'
  workflow_dispatch:

# Read-only by default — Scorecard needs `security-events: write` to
# upload SARIF and `id-token: write` to mint the signed token that
# proves to securityscorecards.dev that this run came from this repo.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to https://securityscorecards.dev so
          # consumers can see our score without running the tool
          # themselves. Public-good visibility for an open-source
          # project; flip to `false` to keep scores internal.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3
        with:
          sarif_file: results.sarif
