# Dependabot configuration for automated security updates
# Satisfies requirement FOUND-04: Dependency vulnerability scanning

version: 2
updates:
  - package-ecosystem: "npm"
    directories: ["/", "/apps/facilitator", "/packages/*"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Group dev dependencies for fewer PRs
      development-dependencies:
        patterns:
          - "@types/*"
          - "vitest"
          - "@vitest/*"
          - "eslint*"
          - "prettier"
          - "typescript"
          - "tsup"
        update-types:
          - "minor"
          - "patch"
      # The x402 Foundation packages move in lockstep; bump them together.
      x402:
        patterns:
          - "@x402/*"
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
        update-types:
          - "minor"
          - "patch"
    # Security updates are always created immediately
    # regardless of the schedule

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
