# Production deployment — VPS (Hetzner / DigitalOcean / etc.)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   - ./config/config.json present with Blockfrost key + signing-file paths
#   - ./secrets/* signing files present with mode 0600
#   - REDIS_PASSWORD set in environment or .env file
#
# The facilitator container mounts config.json read-only at runtime.
# Secrets never appear in the image.

services:
  facilitator:
    build:
      context: .
      dockerfile: Dockerfile
    image: cardano402:latest
    container_name: cardano402
    restart: unless-stopped
    ports:
      # Bind to loopback only — cloudflared tunnels cardano402.com → localhost:3000
      # from the same host, so 0.0.0.0 is a misconfig-from-exposure away if UFW
      # ever flubs. Defense-in-depth (audit H7).
      - "127.0.0.1:3000:3000"
    volumes:
      - ./config/config.json:/app/config/config.json:ro
      - ./secrets:/run/secrets:ro
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      # Mainnet safety guardrail (src/chain/config.ts). Must be "true" when
      # config.json has chain.network = "Mainnet"; "false" otherwise.
      - MAINNET=${MAINNET:-false}
    depends_on:
      redis:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Cap memory + CPU so a runaway request loop can't OOM-kill the host.
    # 768m gives ~5x headroom over steady-state RSS (~120-180m). Generous on
    # purpose: tightening later is easy, debugging an OOM-kill of a payment
    # facilitator under real traffic is not.
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: cardano402-redis
    restart: unless-stopped
    # noeviction is required for fund-safety: the settle/* dedup records
    # (24h TTL) are what makes /settle idempotent against witness-mutation
    # replay. allkeys-lru would let those keys be evicted under memory
    # pressure, silently breaking dedup. Other Redis users on this instance
    # all have short TTLs (utxo cache 60s, reservations 120s) so the
    # natural-expiry bound on memory is ~minutes, not hours.
    # If Redis fills up, writes will fail loudly with OOM rather than evict.
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required for redis}
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      default:
        aliases:
          - redis-prod
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Sits above redis-server --maxmemory 256m with comfortable overhead so
    # AOF rewrite spikes don't trip the limit.
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required for redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
