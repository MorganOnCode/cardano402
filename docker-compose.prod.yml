# Production deployment — VPS (Hetzner / DigitalOcean / etc.)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   - ./config/config.json present with Blockfrost key + seed phrase
#   - REDIS_PASSWORD set in environment or .env file
#
# The facilitator container mounts config.json read-only at runtime.
# Secrets never appear in the image.

services:
  facilitator:
    build:
      context: .
      dockerfile: Dockerfile
    image: cardano402:latest
    container_name: cardano402
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./config/config.json:/app/config/config.json:ro
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      # Mainnet safety guardrail (src/chain/config.ts). Must be "true" when
      # config.json has chain.network = "Mainnet"; "false" otherwise.
      - MAINNET=${MAINNET:-false}
    depends_on:
      redis:
        condition: service_healthy
    # Cap memory + CPU so a runaway request loop can't OOM-kill the host.
    # 768m gives ~5x headroom over steady-state RSS (~120-180m). Generous on
    # purpose: tightening later is easy, debugging an OOM-kill of a payment
    # facilitator under real traffic is not.
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: cardano402-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    # Sits above redis-server --maxmemory 256m with comfortable overhead so
    # AOF rewrite spikes don't trip the limit.
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
